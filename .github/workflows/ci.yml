name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest (placeholder)
        run: 'echo "pytest gate: enabled in Phase 3 (US1)"'

  frontend:
    name: frontend (lint + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest + Playwright (placeholder)
        run: 'echo "vitest + playwright gates: enabled in Phase 3 (US1)"'

  contracts:
    name: contracts (OpenAPI lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Live FastAPI drift check vs. this contract is wired in Phase 2
      # once the app skeleton exists (T016).
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@latest lint specs/001-ato-chat-rag/contracts/api-chat.openapi.yaml
