[project]
name = "ato-assistant-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "hhemanth@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.105.2",
    "fastapi>=0.115",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.4",
    "langsmith>=0.8.8",
    "pgvector>=0.4.2",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "protego>=0.6.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "selectolax>=0.4.10",
    "sqlalchemy>=2.0",
    "supabase>=2.30.1",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.48.0",
    "voyageai>=0.3.7",
]

[project.scripts]
ato-assistant-backend = "ato_assistant_backend:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Python toolchain pin: enforced by `requires-python = ">=3.12,<3.13"` above
# and `backend/.python-version = "3.12"`. UV resolves both before provisioning
# the venv. No `python = ...` key is accepted in [tool.uv] (it's a CLI-config
# table, not a Python-pin table).
required-version = ">=0.11.16"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.15",
    "sqlparse>=0.5.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use bare ``assert`` (S101) and compare against magic
# values like HTTP 200, top-k bounds, embedding dimensions, etc.
# ``PLR2004`` (magic-value-comparison) does not model assertion-style
# tests well — pulling every numeric literal into a named constant
# obscures the intent of the assertion. Same rationale for
# ``PLR0913`` (too-many-args) on test fixtures that pass through
# many dependencies.
"tests/*" = ["S101", "PLR2004", "PLR0913"]
# conftest.py also needs to mutate ``sys.path`` BEFORE importing
# modules that live in the ``src/`` layout — otherwise the imports
# would fail at collection time. Ruff's ``E402`` (module-import-
# not-at-top) does not understand this idiom; the imports are
# deliberately below the sys.path hack and the file's docstring
# explains why.
"tests/conftest.py" = [
  "S101",
  "PLR2004",
  "PLR0913",
  "E402",      # sys.path hack must come before src/ imports
  "PLC0415",   # lazy imports inside fixtures keep heavy SDKs off collection
  "SIM105",    # `try/except/pass` in async teardowns reads more clearly than
  "S110",      # `contextlib.suppress` and silent failure IS the intent here
]
# Repository CRUD methods have one keyword-only argument per table column
# by design — ``PLR0913`` (too-many-args) does not model that shape well.
# The package ``__init__`` also intentionally defers the ``config.settings``
# import to the call site to keep the import graph env-var-free for unit
# tests; ``PLC0415`` would force that import to the top of the file.
"src/db/repos/*.py" = ["PLR0913", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pgvector ships without a py.typed marker; SQLAlchemy 2.x integration
# is the only API surface we touch and its column types compose cleanly
# with our Mapped[...] annotations. Suppress the missing-stubs error
# rather than scattering `# type: ignore` through every entity module.
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# trafilatura and PyYAML ship without type stubs; the seed-corpus loader
# (T036) is the only module that touches them and its public surface is
# narrow (one ``trafilatura.extract`` call, one ``yaml.safe_load`` call).
# Adding the official stub packages would inflate the dev-dependency
# graph for a single internal entry point; suppressing here mirrors the
# pgvector pattern above.
module = ["trafilatura.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Voyage AI SDK ships without ``__all__`` re-exports in its
# top-level ``__init__.py``; mypy's strict mode (``implicit_reexport =
# false``) therefore rejects ``from voyageai import AsyncClient`` even
# though the symbol is reachable at runtime. The ingestion embedder is
# the only module that touches it; relaxing implicit re-export and
# missing-imports here keeps the SDK seam typed without polluting the
# global mypy config.
module = ["voyageai", "voyageai.*"]
ignore_missing_imports = true
implicit_reexport = true
